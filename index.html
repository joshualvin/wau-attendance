<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wahyu Agung Utama Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <button class="iconbtn only-mobile" id="drawerBtn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="brand" href="#/home"><span class="mark" id="mark">WAU</span><span class="brandtext"><b id="coName">Wahyu Agung Utama</b><small>HR</small></span></a>
  <span class="module">HRIS</span>
  <span class="grow"></span>
  <div class="searchwrap"><button class="iconbtn" id="searchBtn" aria-label="Search employees"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <div class="pop searchpop" id="searchPop" hidden><input type="search" id="searchInput" placeholder="Search employee name or ID" autocomplete="off"><div id="searchResults"></div></div></div>
  <button class="iconbtn" id="plusBtn" aria-label="Quick actions"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="iconbtn bell" id="bellBtn" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span class="dotcount" id="bellCount" hidden></span></button>
  <button class="userchip" id="userBtn"><span class="avatar" id="meIni">?</span><span class="usertext"><b id="meName">Choose who you are</b><small id="meCo"></small></span></button>
</header>

<div class="shell" id="shell">
  <aside class="rail" id="rail" aria-label="Main menu"></aside>
  <nav class="subnav" id="subnav" aria-label="Section menu" hidden></nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="flyout" id="flyout" hidden></div>
<div class="pop menupop" id="menuPop" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="modalwrap" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="mhead"><h2 id="modalTitle"></h2><button class="iconbtn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="mbody" id="modalBody"></div><div class="mfoot" id="modalFoot"></div></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
